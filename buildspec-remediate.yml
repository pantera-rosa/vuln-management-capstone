version: 0.2

env:
  variables:
    USE_SAGEMAKER: "false",
    MODEL_ID: "meta-llama/Meta-Llama-3.1-8B-Instruct",
    USE_4BIT_QUANTIZATION: "true",
    AWS_DEFAULT_REGION: "us-east-1",
    S3_BUCKET: "vg-vuln-scan-artifacts-20251016215106",
    S3_ASSESSMENTS_PREFIX: "assessments",
    S3_REMEDIATION_PREFIX: "remediations",
    SAGEMAKER_ENDPOINT: "jumpstart-dft-meta-textgeneration-l-20251120-210732",
    PYTHONUNBUFFERED: "1",
  parameter-store:
    HF_TOKEN: "/vuln-remediate/huggingface-token"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - apt-get update -qq
      - echo "Installing Poetry..."
      - curl -sSL https://install.python-poetry.org | python3 -
      - export PATH="/root/.local/bin:$PATH"

  pre_build:
    commands:
      - echo "Installing Python dependencies..."
      - export PATH="/root/.local/bin:$PATH"
      - poetry install --no-root
      - echo "Verifying AWS access and S3..."
      - aws sts get-caller-identity
      - aws s3 ls s3://$S3_BUCKET/$S3_ASSESSMENTS_PREFIX/ --recursive | head -5

  build:
    commands:
      - echo "Starting remediation workflow..."
      - export PATH="/root/.local/bin:$PATH"
      - export PYTHONPATH="$CODEBUILD_SRC_DIR:$PYTHONPATH"
      
      # Get the most recent assessment file
      - |
        LATEST_ASSESSMENT=$(aws s3 ls s3://$S3_BUCKET/$S3_ASSESSMENTS_PREFIX/ \
          --recursive \
          --query 'sort_by(Contents, &LastModified)[-1].Key' \
          --output text)
      
      - echo "Latest assessment file: $LATEST_ASSESSMENT"
      
      # Run remediation
      - |
        poetry run python -c "
        import pandas as pd
        import boto3
        from pathlib import Path
        
        # Download assessment file
        s3 = boto3.client('s3')
        local_path = '/tmp/assessment.parquet'
        s3.download_file('$S3_BUCKET', '$LATEST_ASSESSMENT', local_path)
        
        # Load data
        df = pd.read_parquet(local_path)
        print(f'Loaded {len(df)} vulnerability records')
        
        # Run remediation
        from src.backend.workflow.vuln_remediate.generate_remediation import generate_remediation
        
        output_parquet = '/tmp/remediation_results.parquet'
        output_json = '/tmp/remediation_results.json'
        
        remediated_df = generate_remediation(
            vuln_df=df,
            model_id='meta-code-llama',
            output_pd_path=output_parquet,
            dep_repos_root_dir_path='./artifacts/identify/repos',
            with_quantization=False,
            use_sagemaker=True,
            sagemaker_endpoint_name='$SAGEMAKER_ENDPOINT',
            aws_region='us-east-1',
            output_json_path=output_json
        )
        
        print(f'✅ Remediation complete. Generated {len(remediated_df)} fixes')
        
        # Upload results to S3
        assessment_stem = Path('$LATEST_ASSESSMENT').stem
        
        parquet_key = f'$S3_REMEDIATION_PREFIX/remediation_{assessment_stem}.parquet'
        json_key = f'$S3_REMEDIATION_PREFIX/remediation_{assessment_stem}.json'
        
        s3.upload_file(output_parquet, '$S3_BUCKET', parquet_key)
        s3.upload_file(output_json, '$S3_BUCKET', json_key)
        
        print(f'✅ Uploaded: s3://$S3_BUCKET/{parquet_key}')
        print(f'✅ Uploaded: s3://$S3_BUCKET/{json_key}')
        "

  post_build:
    commands:
      - echo "Remediation workflow completed at $(date)"

artifacts:
  files:
    - "**/*"
  name: "remediation-output"

