version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    S3_BUCKET: "vg-vuln-scan-artifacts-20251016215106"
    S3_ASSESSMENTS_PREFIX: "assessments"
    S3_REMEDIATION_PREFIX: "remediations"
    MODEL_ID: "meta-llama/Meta-Llama/Meta-Llama-3.1-8B-Instruct"
    USE_4BIT_QUANTIZATION: "true"
    PYTHONUNBUFFERED: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - apt-get update -qq
      - curl -sSL https://install.python-poetry.org | python3 -
      - export PATH="/root/.local/bin:$PATH"
      - poetry install --no-root
      - pip install "transformers>=4.46.0,<5.0.0"

  build:
    commands:
      - echo "Starting remediation workflow..."
      - export PATH="/root/.local/bin:$PATH"
      - export PYTHONPATH="$CODEBUILD_SRC_DIR:$PYTHONPATH"
      - aws sts get-caller-identity
      - aws s3 ls s3://$S3_BUCKET/$S3_ASSESSMENTS_PREFIX/ --recursive | head -5
      - poetry run python scripts/run_remediation_from_build.py

artifacts:
  files:
    - "**/*"
  name: "remediation-output"
