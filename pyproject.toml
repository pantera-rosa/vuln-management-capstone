[project]
name = "src"
version = "0.1.0"
description = "VulnGuard"
authors = [
    {name = "Jacqueline Tiffany Yeung",email = "jtyeung168@berkeley.edu"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard] (>=0.117.1,<0.118.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "httpx (>=0.27.0)",
    "tenacity (>=8.2.3)",
    "python-dotenv (>=1.0.1)",
    "numpy (>=2.3.3,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "jsonlines (>=4.0.0,<5.0.0)",
    "unsloth (>=2025.10.1,<2026.0.0)",
    "cpgqls-client (>=0.0.9,<0.0.10)",
    "nest-asyncio (>=1.6.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"