# resources.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model template describing your function.
Resources:
  triggervulnpipeline:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: Trigger vulnerability management pipeline from external repos
      MemorySize: 128
      Timeout: 30
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          CACHE_EXPIRY_HOURS: '168'
          S3_BUCKET: vg-vuln-scan-artifacts-20251016215106
          STATE_MACHINE_ARN: arn:aws:states:us-east-1:654654605701:stateMachine:VulnGuardPipeline
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      PackageType: Zip
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: >-
                arn:aws:logs:us-east-1:654654605701:log-group:/aws/lambda/trigger-vuln-pipeline*
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: >-
                arn:aws:states:us-east-1:654654605701:stateMachine:VulnGuardPipeline
      RecursiveLoop: Terminate
      SnapStart:
        ApplyOn: None
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
