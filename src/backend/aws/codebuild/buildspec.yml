version: 0.2

env:
  variables:
    REPO_URL: "https://github.com/veracode/verademo.git"
    OUT_DIR: "out"
  parameter-store: {}
  secrets-manager: {}

phases:
  install:
    commands:
      - echo "Installing tools..."
      - apt-get update -y && apt-get install -y curl jq python3-pip
      # Install Syft (SBOM generator)
      - curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin
      # Install Grype (vuln scanner)
      - curl -sSfL https://get.anchore.io/grype | sh -s -- -b /usr/local/bin
      # Optional: pandas/pyarrow if you want a Parquet export
      - pip3 install --no-cache-dir pandas pyarrow
  pre_build:
    commands:
      - echo "Cloning VeraDemo..."
      - git clone "$REPO_URL" verademo
  build:
    commands:
      - mkdir -p $OUT_DIR
      # 1) Generate SPDX SBOM from the folder (syft)
      - syft dir:verademo -o spdx-json > $OUT_DIR/verademo_sbom.spdx.json
      # 2) Scan SBOM with grype, emit JSON
      - grype sbom:$OUT_DIR/verademo_sbom.spdx.json -o json > $OUT_DIR/verademo_grype_scan.json
      # (Optional) Also scan the directory directly:
      # - grype dir:verademo -o json > $OUT_DIR/verademo_grype_scan_dir.json
      # 3) OPTIONAL: produce a quick Parquet table from the Grype JSON
      - |
        python3 - <<'PY'
        import json, pandas as pd, pathlib
        p = pathlib.Path("out/verademo_grype_scan.json")
        j = json.loads(p.read_text())
        matches = j.get("matches", [])
        # flatten a few common fields; adjust as needed
        rows=[]
        for m in matches:
            v = m.get("vulnerability", {})
            a = m.get("artifact", {})
            rows.append({
              "vuln_id": v.get("id"),
              "severity": v.get("severity"),
              "cvss": (v.get("cvss",[]) or [{}])[0].get("baseScore"),
              "package": a.get("name"),
              "version": a.get("version"),
              "type": a.get("type"),
            })
        df = pd.DataFrame(rows)
        df.to_parquet("out/verademo_grype_scan.parquet", index=False)
        PY
  post_build:
    commands:
      - echo "Done. Artifacts will be uploaded by CodeBuild."
artifacts:
  files:
    - out/verademo_sbom.spdx.json
    - out/verademo_grype_scan.json
    - out/verademo_grype_scan.parquet
  discard-paths: yes
