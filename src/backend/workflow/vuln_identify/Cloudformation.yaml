AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS Batch with EC2 (c6i.4xlarge) for Vulnerability Code Identification"

Parameters:
  S3BucketName:
    Type: String
    Description: S3 bucket for scan results

  GitHubToken:
    Type: String
    Description: GitHub Personal Access Token
    NoEcho: true

  SemgrepAppToken:
    Type: String
    Description: Semgrep App Token (optional)
    Default: ""
    NoEcho: true

  ECRImageUri:
    Type: String
    Description: ECR Image URI for the Batch job

  MaxvCpus:
    Type: Number
    Description: Maximum vCPUs for compute environment
    Default: 32
    MinValue: 16

Resources:
  # ===========================================
  # IAM Roles
  # ===========================================
  
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-ec2-service-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-ec2-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-ec2-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: batch-vuln-identify-ec2-instance-profile
      Roles:
        - !Ref ECSInstanceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-ec2-job-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"

  # ===========================================
  # Networking
  # ===========================================
  
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: vuln-identify-batch-ec2-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: vuln-identify-ec2-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: vuln-identify-ec2-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: vuln-identify-ec2-public-2

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: vuln-identify-ec2-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Batch EC2 jobs
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: vuln-identify-ec2-sg

  # ===========================================
  # Batch Compute Environment (EC2)
  # ===========================================
  
  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: vuln-identify-compute-env-ec2-c6i
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        DesiredvCpus: 0
        InstanceTypes:
          - c6i.4xlarge
        InstanceRole: !GetAtt ECSInstanceProfile.Arn
        Subnets:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        Tags:
          Name: vuln-identify-batch-worker-ec2

  # ===========================================
  # Batch Job Queue
  # ===========================================
  
  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: vuln-identify-queue-ec2-c6i
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  # ===========================================
  # Batch Job Definition (EC2)
  # ===========================================
  
  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: vuln-identify-job-ec2-c6i
      Type: container
      ContainerProperties:
        Image: !Ref ECRImageUri
        Vcpus: 16
        Memory: 30720
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: vuln-identify-ec2
        Environment:
          - Name: S3_BUCKET
            Value: !Ref S3BucketName
          - Name: GH_TOKEN
            Value: !Ref GitHubToken
          - Name: SEMGREP_APP_TOKEN
            Value: !Ref SemgrepAppToken
          - Name: ENABLE_DATAFLOW_TRACES
            Value: 'false'
          - Name: SEMGREP_NUM_JOBS
            Value: '16'
          - Name: SEMGREP_TIMEOUT
            Value: '300'
          - Name: PYTHONUNBUFFERED
            Value: '1'
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 28800

  # ===========================================
  # CloudWatch Logs
  # ===========================================
  
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/vuln-identify-ec2-c6i
      RetentionInDays: 30

Outputs:
  JobQueueArn:
    Description: ARN of the Batch Job Queue
    Value: !Ref JobQueue
    Export:
      Name: VulnIdentifyJobQueueArnEC2C6i

  JobDefinitionArn:
    Description: ARN of the Batch Job Definition
    Value: !Ref JobDefinition
    Export:
      Name: VulnIdentifyJobDefinitionArnEC2C6i

  ComputeEnvironmentArn:
    Description: ARN of the Compute Environment
    Value: !Ref ComputeEnvironment

  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  LogGroupName:
    Description: CloudWatch Log Group
    Value: !Ref LogGroup