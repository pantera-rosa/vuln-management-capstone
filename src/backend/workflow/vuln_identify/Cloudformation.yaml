AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS Batch Infrastructure for Vulnerability Code Identification"

Parameters:
  S3BucketName:
    Type: String
    Description: S3 bucket for scan results

  GitHubToken:
    Type: String
    Description: GitHub Personal Access Token
    NoEcho: true

  SemgrepAppToken:
    Type: String
    Description: Semgrep App Token (optional)
    Default: ""
    NoEcho: true

  ECRImageUri:
    Type: String
    Description: ECR Image URI for the Batch job

  MaxvCpus:
    Type: Number
    Description: Maximum vCPUs for compute environment
    Default: 16

  JobMemory:
    Type: Number
    Description: Memory for each job (in MiB)
    Default: 8192

  JobvCpus:
    Type: Number
    Description: vCPUs for each job
    Default: 4

Resources:
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-service-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: batch-vuln-identify-job-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: vuln-identify-batch-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: vuln-identify-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: vuln-identify-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: vuln-identify-public-2

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: vuln-identify-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Batch jobs
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: vuln-identify-batch-sg

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: vuln-identify-compute-env-ec2
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        MinvCpus: 0
        MaxvCpus: 16
        DesiredvCpus: 0
        InstanceTypes:
          - optimal
        Subnets:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        SecurityGroupIds:
          - !Ref BatchSecurityGroup

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: vuln-identify-queue
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: vuln-identify-job
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Ref ECRImageUri
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobvCpus
          - Type: MEMORY
            Value: !Ref JobMemory
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
        NetworkConfiguration:
          AssignPublicIp: ENABLED
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: vuln-identify
        Environment:
          - Name: S3_BUCKET
            Value: !Ref S3BucketName
          - Name: GH_TOKEN
            Value: !Ref GitHubToken
          - Name: SEMGREP_APP_TOKEN
            Value: !Ref SemgrepAppToken
          - Name: ENABLE_DATAFLOW_TRACES
            Value: "false"
          - Name: SEMGREP_NUM_JOBS
            Value: "6"
          - Name: PYTHONUNBUFFERED
            Value: "1"
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 28800

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/vuln-identify
      RetentionInDays: 30

Outputs:
  JobQueueArn:
    Description: ARN of the Batch Job Queue
    Value: !Ref JobQueue
    Export:
      Name: VulnIdentifyJobQueueArn

  JobDefinitionArn:
    Description: ARN of the Batch Job Definition
    Value: !Ref JobDefinition
    Export:
      Name: VulnIdentifyJobDefinitionArn

  ComputeEnvironmentArn:
    Description: ARN of the Compute Environment
    Value: !Ref ComputeEnvironment

  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  LogGroupName:
    Description: CloudWatch Log Group
    Value: !Ref LogGroup