version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    S3_BUCKET: "vg-vuln-scan-artifacts-20251016215106"
    S3_INPUT_PREFIX: "scans"
    S3_OUTPUT_PREFIX: "identifications"
    ENABLE_DATAFLOW_TRACES: "false"
    SEMGREP_NUM_JOBS: "32"
    SEMGREP_TIMEOUT: "300"
    SEMGREP_MAX_FILE_SIZE: "1000000"
    PYTHONUNBUFFERED: "1"
  parameter-store:
    GH_TOKEN: "/vuln-identify/github-token"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing system dependencies..."
      - apt-get update -qq
      - apt-get install -y git curl
      - echo "Installing GitHub CLI..."
      - curl -sSfL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz -o gh.tar.gz
      - tar -xzf gh.tar.gz
      - mv gh_2.62.0_linux_amd64/bin/gh /usr/local/bin/gh
      - chmod +x /usr/local/bin/gh
      - echo "Installing Poetry..."
      - curl -sSL https://install.python-poetry.org | python3 -
      - export PATH="/root/.local/bin:$PATH"
      - poetry --version
  
  pre_build:
    commands:
      - echo "Installing Python dependencies..."
      - export PATH="/root/.local/bin:$PATH"
      - poetry install --no-root
      - poetry run pip install semgrep==1.99.0
      - echo "Configuring GitHub authentication..."
      - git config --global credential.helper store
      - git config --global url."https://oauth2:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - echo "Verifying AWS access..."
      - aws sts get-caller-identity
  
  build:
    commands:
      - echo "Starting vulnerability identification workflow..."
      - export PATH="/root/.local/bin:$PATH"
      - export PYTHONPATH="$(pwd):$PYTHONPATH"
      - |
        poetry run python -m src.backend.workflow.vuln_identify.vuln_code_identify \
          --s3-input-prefix "$S3_INPUT_PREFIX" \
          --s3-bucket "$S3_BUCKET" \
          --s3-output-prefix "$S3_OUTPUT_PREFIX" \
          --semgrep-jobs "$SEMGREP_NUM_JOBS" \
          --semgrep-timeout "$SEMGREP_TIMEOUT" \
          --max-file-size "$SEMGREP_MAX_FILE_SIZE" \
          $(if [ "$ENABLE_DATAFLOW_TRACES" = "true" ]; then echo "--enable-dataflow-traces"; fi)
  
  post_build:
    commands:
      - echo "Build completed at $(date)"
      - echo "Results at s3://$S3_BUCKET/$S3_OUTPUT_PREFIX/"